<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background felt radial gradient -->
    <radialGradient id="feltBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1b5e3a"/>
      <stop offset="60%" stop-color="#0e3d24"/>
      <stop offset="100%" stop-color="#061c10"/>
    </radialGradient>

    <!-- Gold border gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8018"/>
      <stop offset="100%" stop-color="#ffd859"/>
    </linearGradient>

    <!-- Cat fur gradients -->
    <linearGradient id="catFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4750b"/>
    </linearGradient>
    <linearGradient id="catMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1d6"/>
    </linearGradient>

    <!-- Eye gradient -->
    <radialGradient id="catEye" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#55e670"/>
      <stop offset="50%" stop-color="#1fa83a"/>
      <stop offset="100%" stop-color="#0b5218"/>
    </radialGradient>

    <!-- Vest gradient -->
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3138"/>
      <stop offset="50%" stop-color="#1a1d20"/>
      <stop offset="100%" stop-color="#0f1113"/>
    </linearGradient>

    <!-- Red Bowtie gradient -->
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4e"/>
      <stop offset="60%" stop-color="#d91428"/>
      <stop offset="100%" stop-color="#8a000e"/>
    </linearGradient>

    <!-- Card gradient & shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0efe9"/>
    </linearGradient>

    <!-- Gold Chip Gradients -->
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#c99716"/>
    </linearGradient>
    <linearGradient id="chipRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5967"/>
      <stop offset="100%" stop-color="#aa0e1c"/>
    </linearGradient>
  </defs>

  <!-- Circular Clip Path for telegram avatar preview -->
  <clipPath id="avatarClip">
    <circle cx="256" cy="256" r="248"/>
  </clipPath>

  <g clip-path="url(#avatarClip)">
    <!-- 1. Background Casino Table Felt -->
    <rect width="512" height="512" fill="url(#feltBg)"/>

    <!-- Table Felt subtle texture / diamond lines -->
    <path d="M-50,256 L256,-50 L562,256 L256,562 Z" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="40"/>
    <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,215,0,0.08)" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Decorative background casino chips (left & right) -->
    <!-- Left Chip Stack -->
    <g transform="translate(60, 360) rotate(-15)" filter="url(#dropShadow)" opacity="0.85">
      <ellipse cx="0" cy="20" rx="36" ry="14" fill="#66050e"/>
      <ellipse cx="0" cy="12" rx="36" ry="14" fill="url(#chipRed)"/>
      <ellipse cx="0" cy="0" rx="36" ry="14" fill="url(#chipGold)"/>
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 3"/>
    </g>
    <!-- Right Chip Stack -->
    <g transform="translate(445, 370) rotate(20)" filter="url(#dropShadow)" opacity="0.85">
      <ellipse cx="0" cy="18" rx="34" ry="13" fill="#1b3c66"/>
      <ellipse cx="0" cy="10" rx="34" ry="13" fill="#2d6cb5"/>
      <ellipse cx="0" cy="0" rx="34" ry="13" fill="url(#chipGold)"/>
      <ellipse cx="0" cy="0" rx="24" ry="9" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 3"/>
    </g>

    <!-- Sparkles / Gold Stars -->
    <g fill="#ffd700" opacity="0.7">
      <path d="M100,120 Q100,135 115,135 Q100,135 100,150 Q100,135 85,135 Q100,135 100,120 Z"/>
      <path d="M410,110 Q410,120 420,120 Q410,120 410,130 Q410,120 400,120 Q410,120 410,110 Z" transform="scale(0.8) translate(80, 20)"/>
      <circle cx="140" cy="90" r="3" fill="#fff" opacity="0.8"/>
      <circle cx="380" cy="80" r="2.5" fill="#fff" opacity="0.8"/>
    </g>

    <!-- 2. Cat Body & Croupier Suit -->
    <!-- White Shirt -->
    <path d="M190,390 L256,410 L322,390 L340,512 L172,512 Z" fill="#ffffff" filter="url(#dropShadow)"/>

    <!-- Black Croupier Vest -->
    <path d="M140,430 C155,385 190,370 215,385 L256,470 L170,512 L120,512 Z" fill="url(#vestGrad)" filter="url(#dropShadow)"/>
    <path d="M372,430 C357,385 322,370 297,385 L256,470 L342,512 L392,512 Z" fill="url(#vestGrad)" filter="url(#dropShadow)"/>
    <!-- Vest Gold Buttons -->
    <circle cx="256" cy="485" r="4.5" fill="url(#chipGold)" filter="url(#dropShadow)"/>
    <circle cx="256" cy="505" r="4.5" fill="url(#chipGold)"/>

    <!-- Shirt Collar -->
    <polygon points="215,378 256,412 240,378" fill="#e8e8e8"/>
    <polygon points="297,378 256,412 272,378" fill="#ffffff"/>

    <!-- Red Bow Tie -->
    <g filter="url(#dropShadow)">
      <!-- Left wing -->
      <polygon points="256,392 212,375 215,410" fill="url(#bowGrad)"/>
      <!-- Right wing -->
      <polygon points="256,392 300,375 297,410" fill="url(#bowGrad)"/>
      <!-- Center knot -->
      <ellipse cx="256" cy="392" rx="9" ry="8" fill="#ff4d5e"/>
    </g>

    <!-- 3. Cat Head & Ears -->
    <!-- Ears -->
    <!-- Left Ear outer -->
    <polygon points="160,195 130,85 210,140" fill="url(#catFur)" filter="url(#dropShadow)"/>
    <!-- Left Ear inner pink -->
    <polygon points="158,180 142,105 198,145" fill="#fca8b8"/>

    <!-- Right Ear outer -->
    <polygon points="352,195 382,85 302,140" fill="url(#catFur)" filter="url(#dropShadow)"/>
    <!-- Right Ear inner pink -->
    <polygon points="354,180 370,105 314,145" fill="#fca8b8"/>

    <!-- Head Base -->
    <ellipse cx="256" cy="245" rx="115" ry="105" fill="url(#catFur)" filter="url(#dropShadow)"/>

    <!-- Cheeks fur tufts -->
    <path d="M145,260 C125,270 120,295 140,310 C128,320 135,340 160,340 C190,340 210,350 256,350 C302,350 322,340 352,340 C377,340 384,320 372,310 C392,295 387,270 367,260" fill="url(#catFur)"/>

    <!-- White Fur Face Mask / Muzzle area -->
    <path d="M190,260 C180,315 210,345 256,345 C302,345 332,315 322,260 C300,285 275,290 256,290 C237,290 212,285 190,260 Z" fill="url(#catMuzzle)"/>

    <!-- Forehead cute stripes -->
    <g fill="#b85f00" opacity="0.65">
      <path d="M256,150 L251,180 L261,180 Z"/>
      <path d="M236,155 L234,180 L242,180 Z"/>
      <path d="M276,155 L278,180 L270,180 Z"/>
    </g>

    <!-- Eyes (Big charismatic cartoon eyes) -->
    <!-- Left Eye -->
    <g filter="url(#dropShadow)">
      <ellipse cx="205" cy="235" rx="26" ry="32" fill="#ffffff"/>
      <ellipse cx="207" cy="235" rx="20" ry="26" fill="url(#catEye)"/>
      <!-- Pupil with sly/confident slit/circle -->
      <ellipse cx="210" cy="235" rx="10" ry="20" fill="#111111"/>
      <!-- Highlights -->
      <circle cx="202" cy="223" r="7" fill="#ffffff"/>
      <circle cx="216" cy="245" r="3" fill="#ffffff"/>
      <!-- Eyelid / brow (confident look) -->
      <path d="M178,216 Q210,210 234,226" fill="none" stroke="#8c4100" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Right Eye (Slight sly wink or open confident) -->
    <g filter="url(#dropShadow)">
      <ellipse cx="307" cy="235" rx="26" ry="32" fill="#ffffff"/>
      <ellipse cx="305" cy="235" rx="20" ry="26" fill="url(#catEye)"/>
      <!-- Pupil -->
      <ellipse cx="302" cy="235" rx="10" ry="20" fill="#111111"/>
      <!-- Highlights -->
      <circle cx="297" cy="223" r="7" fill="#ffffff"/>
      <circle cx="311" cy="245" r="3" fill="#ffffff"/>
      <!-- Eyelid / brow -->
      <path d="M334,216 Q302,210 278,226" fill="none" stroke="#8c4100" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Cute Pink Nose -->
    <polygon points="256,280 246,268 266,268" fill="#ff6b8b" stroke="#e04f6e" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Mouth & Smile -->
    <path d="M256,280 L256,293 C256,298 243,306 232,300" fill="none" stroke="#5a2e00" stroke-width="3" stroke-linecap="round"/>
    <path d="M256,293 C256,298 269,306 280,300" fill="none" stroke="#5a2e00" stroke-width="3" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <!-- Left whiskers -->
      <line x1="185" y1="285" x2="115" y2="275"/>
      <line x1="182" y1="295" x2="110" y2="298"/>
      <line x1="185" y1="305" x2="120" y2="320"/>
      <!-- Right whiskers -->
      <line x1="327" y1="285" x2="397" y2="275"/>
      <line x1="330" y1="295" x2="402" y2="298"/>
      <line x1="327" y1="305" x2="392" y2="320"/>
    </g>

    <!-- 4. Foreground: Paw holding Playing Card (Ace of Spades) -->
    <!-- Card Group tilted forward with big drop shadow -->
    <g transform="translate(340, 310) rotate(-18)" filter="url(#dropShadow)">
      <!-- Card Body -->
      <rect x="0" y="0" width="105" height="155" rx="8" ry="8" fill="url(#cardGrad)" stroke="#c4c0b4" stroke-width="2"/>
      <!-- Card inner gold border line -->
      <rect x="5" y="5" width="95" height="145" rx="5" ry="5" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>

      <!-- Corner Ace text & small spade (Top Left) -->
      <text x="12" y="28" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="bold" fill="#111111">A</text>
      <!-- Small spade top -->
      <path d="M18,36 C14,40 10,44 18,48 C26,44 22,40 18,36 Z M18,47 L18,52 L16,52 L20,52 Z" fill="#111111"/>

      <!-- Corner Ace text & small spade (Bottom Right inverted) -->
      <g transform="rotate(180, 52.5, 77.5)">
        <text x="12" y="28" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="bold" fill="#111111">A</text>
        <path d="M18,36 C14,40 10,44 18,48 C26,44 22,40 18,36 Z M18,47 L18,52 L16,52 L20,52 Z" fill="#111111"/>
      </g>

      <!-- Center Big Spade with subtle glow/gold filigree -->
      <g transform="translate(52.5, 75) scale(1.6)">
        <!-- Master Spade icon -->
        <path d="M0,-22 C-14,-6 -22,6 0,20 C22,6 14,-6 0,-22 Z" fill="#111111"/>
        <!-- Stem -->
        <path d="M0,14 C-3,19 -7,24 -8,25 L8,25 C7,24 3,19 0,14 Z" fill="#111111"/>
        <!-- Gold center emblem inside spade -->
        <circle cx="0" cy="5" r="4" fill="url(#chipGold)"/>
      </g>
    </g>

    <!-- Cat Paw holding the card -->
    <g filter="url(#dropShadow)">
      <!-- Paw arm coming from bottom right -->
      <path d="M380,480 C370,430 350,390 325,370 C310,385 305,420 310,460 Z" fill="url(#catFur)"/>
      <!-- Paw fingers wrapping on card -->
      <ellipse cx="328" cy="380" rx="14" ry="12" fill="url(#catMuzzle)" stroke="#d4750b" stroke-width="1.5"/>
      <ellipse cx="342" cy="392" rx="13" ry="11" fill="url(#catMuzzle)" stroke="#d4750b" stroke-width="1.5"/>
      <ellipse cx="358" cy="408" rx="13" ry="11" fill="url(#catMuzzle)" stroke="#d4750b" stroke-width="1.5"/>
      <ellipse cx="320" cy="395" rx="12" ry="10" fill="url(#catMuzzle)" stroke="#d4750b" stroke-width="1.5"/>
      <!-- Cute pink paw pad hint -->
      <ellipse cx="332" cy="405" rx="8" ry="6" fill="#fca8b8" opacity="0.8"/>
    </g>

    <!-- Left paw resting on table edge -->
    <g filter="url(#dropShadow)">
      <path d="M140,460 C155,425 175,410 195,435 C185,465 170,490 150,512 Z" fill="url(#catFur)"/>
      <ellipse cx="185" cy="435" rx="16" ry="13" fill="url(#catMuzzle)" stroke="#d4750b" stroke-width="1.5"/>
      <ellipse cx="170" cy="445" rx="14" ry="12" fill="url(#catMuzzle)" stroke="#d4750b" stroke-width="1.5"/>
    </g>

    <!-- Subtle vignette shadow at borders -->
    <circle cx="256" cy="256" r="248" fill="none" stroke="#000000" stroke-width="18" opacity="0.45"/>
  </g>

  <!-- 5. Luxury Gold Border (Telegram circular outline) -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#goldBorder)" stroke-width="12" filter="url(#dropShadow)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
</svg>