services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamble_game
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gamble_game
      JWT_SECRET: change_me_in_production
      TELEGRAM_BOT_TOKEN: put_bot_token_here
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
volumes:
  postgres_data:
